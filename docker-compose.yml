version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vulturebot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vulture
      POSTGRES_PASSWORD: vulture_secret
      POSTGRES_DB: vulturebot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulture -d vulturebot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulturebot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://vulture:vulture_secret@db:5432/vulturebot
      - AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=mistral:latest
      - EMAIL_PROVIDER=mock
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
